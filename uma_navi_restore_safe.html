<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMA-NAVI AI 安全復元</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:18px;line-height:1.55;color:#222}h2{font-size:21px}button,input{font-size:16px;margin:8px 0}button{padding:12px 16px;border:0;border-radius:9px;background:#1769aa;color:white}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f2f2;padding:12px;border-radius:8px} .warn{color:#9a4d00}</style></head>
<body><h2>UMA-NAVI AI 安全復元ツール</h2>
<p class="warn">旧データベース umaNaviDB_v2 は変更しません。復元先は umaNaviDB_v25 です。バックアップJSON自体も変更しません。</p>
<p>23MBのバックアップJSONを選択してください。</p><input id="file" type="file" accept=".json,application/json"><br>
<button id="check">ファイル内容を確認</button> <button id="restore" disabled>新しい保存領域へ復元</button>
<pre id="log">待機中</pre>
<script>
const $=id=>document.getElementById(id);let parsed=null,db=null;
function log(s){$('log').textContent+=`\n${s}`;}
function openDB(){return new Promise((resolve,reject)=>{let r;try{r=indexedDB.open('umaNaviDB_v25',1)}catch(e){reject(e);return}r.onupgradeneeded=()=>{const d=r.result;for(const n of ['races','horses','pays'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'_key'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('DB open error'));r.onblocked=()=>reject(new Error('DBが別タブで使用中です。UMA-NAVIの他のタブを閉じて再試行してください。'));});}
$('check').onclick=async()=>{try{$('log').textContent='';$('restore').disabled=true;const f=$('file').files[0];if(!f)throw Error('先にJSONファイルを選択してください');log(`ファイル：${f.name}（${(f.size/1024/1024).toFixed(2)}MB）`);parsed=JSON.parse(await f.text());const root=parsed.data&&typeof parsed.data==='object'?parsed.data:parsed;const counts={races:Array.isArray(root.races)?root.races.length:0,horses:Array.isArray(root.horses)?root.horses.length:0,pays:Array.isArray(root.pays)?root.pays.length:0};log(`バックアップ内件数：レース ${counts.races} / 馬 ${counts.horses} / 払戻 ${counts.pays}`);for(const n of Object.keys(counts)){const a=root[n]||[];const missing=a.filter(x=>!x||x._key===undefined||x._key===null||x._key==='').length;log(`${n}: _keyなし ${missing}件`);if(missing)throw Error(`${n}に_keyがないデータがあります。復元を中止しました`);}if(!counts.races&&!counts.horses&&!counts.pays)throw Error('復元できるデータがありません');log('内容確認OK。復元ボタンを押せます。');$('restore').disabled=false;}catch(e){parsed=null;log('確認エラー：'+(e.message||e));}};
async function writeChunk(store,rows,start,end){return new Promise((resolve,reject)=>{let tx;try{tx=db.transaction(store,'readwrite');const os=tx.objectStore(store);for(let i=start;i<end;i++)os.put(rows[i]);}catch(e){reject(e);return}tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error(store+' transaction error'));tx.onabort=()=>reject(tx.error||new Error(store+' transaction aborted'));});}
$('restore').onclick=async()=>{if(!parsed)return;const root=parsed.data&&typeof parsed.data==='object'?parsed.data:parsed;if(!confirm('umaNaviDB_v25へ復元します。旧DB umaNaviDB_v2 は変更しません。既存のv2.5データには同じキーのデータを上書きします。続けますか？'))return;$('restore').disabled=true;$('check').disabled=true;try{log('保存領域を開いています…');db=await openDB();for(const store of ['races','horses','pays']){const rows=Array.isArray(root[store])?root[store]:[];log(`${store}: ${rows.length}件を書き込み開始`);const batch=50;for(let i=0;i<rows.length;i+=batch){await writeChunk(store,rows,i,Math.min(i+batch,rows.length));if((i+batch)%500===0||i+batch>=rows.length)log(`${store}: ${Math.min(i+batch,rows.length)} / ${rows.length}件 完了`);}log(`${store}: 完了`);}log('全データの書き込み完了。件数を確認しています…');for(const store of ['races','horses','pays']){const count=await new Promise((resolve,reject)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).count();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.onerror=()=>reject(tx.error);});log(`${store}: 保存領域内 ${count}件`);}log('復元処理が完了しました。UMA-NAVI v2.5.1を再読み込みして件数を確認してください。');}catch(e){log('復元エラー：'+(e.message||e));log('ここで停止しました。何度も再実行せず、この結果を送ってください。');}finally{if(db){db.close();db=null;}$('check').disabled=false;}};
</script></body></html>
