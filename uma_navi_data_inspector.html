<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMA-NAVI AI データ診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:850px;margin:0 auto;padding:16px;line-height:1.55;color:#222}h1{font-size:22px}h2{font-size:18px;margin:0 0 10px}.panel{border:1px solid #ccc;border-radius:12px;padding:14px;margin:14px 0}button{font-size:16px;padding:12px 16px;border:0;border-radius:9px;background:#1769aa;color:white;font-weight:700}.status{white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px;margin-top:10px}.sample{border-top:1px solid #ddd;padding:10px 0}.key{font-weight:700;color:#124f83;overflow-wrap:anywhere}.val{font-size:13px;overflow-wrap:anywhere;color:#333}small{color:#666}
</style></head><body>
<h1>UMA-NAVI AI データ診断</h1>
<p>このページは <b>umaNaviDB_v25</b> を読み取り専用で確認します。データの追加・変更・削除は一切しません。</p>
<div class="panel"><button id="run">データ項目を調べる</button><div id="status" class="status">まだ診断していません。</div></div><div id="output"></div>
<script>
(()=>{const DB='umaNaviDB_v25',VERSION=1,$=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,VERSION);req.onsuccess=()=>{const d=req.result;d.onversionchange=()=>d.close();resolve(d)};req.onerror=()=>reject(req.error||new Error('DBを開けません'));req.onblocked=()=>reject(new Error('ほかのUMA-NAVI画面を閉じて再読み込みしてください'))})}
function inspectStore(db,name){return new Promise((resolve,reject)=>{let tx;try{tx=db.transaction(name,'readonly')}catch(e){reject(e);return}const store=tx.objectStore(name),samples=[];let count=0;const cr=store.count();cr.onsuccess=()=>count=cr.result;const req=store.openCursor();req.onsuccess=()=>{const cur=req.result;if(!cur)return;if(samples.length<3)samples.push(cur.value);if(samples.length>=3)return;cur.continue()};req.onerror=()=>reject(req.error||new Error(name+'の読み込みに失敗'));tx.oncomplete=()=>resolve({name,count,samples,keyPath:store.keyPath});tx.onerror=()=>reject(tx.error||new Error(name+'の診断に失敗'));tx.onabort=()=>reject(tx.error||new Error(name+'の診断が中断'))})}
function safe(v){if(v===null)return'null';if(v===undefined)return'（値なし）';if(typeof v==='object'){try{return JSON.stringify(v).slice(0,180)}catch(_){return'[object]'}}return String(v).replace(/\s+/g,' ').slice(0,180)}
function render(r){const sec=document.createElement('section');sec.className='panel';const h=document.createElement('h2');h.textContent=r.name+'：'+r.count.toLocaleString()+'件';sec.appendChild(h);const kp=document.createElement('small');kp.textContent='キー項目：'+r.keyPath;sec.appendChild(kp);if(!r.samples.length){const p=document.createElement('p');p.textContent='データなし';sec.appendChild(p)}r.samples.forEach((obj,i)=>{const wrap=document.createElement('div');wrap.className='sample';const title=document.createElement('b');title.textContent='サンプル '+(i+1);wrap.appendChild(title);Object.keys(obj||{}).sort().forEach(k=>{const line=document.createElement('div'),key=document.createElement('div'),val=document.createElement('div');key.className='key';key.textContent=k;val.className='val';val.textContent=safe(obj[k]);line.appendChild(key);line.appendChild(val);wrap.appendChild(line)});sec.appendChild(wrap)});$('output').appendChild(sec)}
$('run').onclick=async()=>{$('run').disabled=true;$('output').innerHTML='';$('status').textContent='データベースを読み取り中…\n画面を閉じずにお待ちください。';let db;try{db=await openDB();const results=[];for(const name of ['races','horses','pays']){$('status').textContent=name+' を確認中…';results.push(await inspectStore(db,name))}results.forEach(render);$('status').textContent='診断完了。3種類のデータを読み取り専用で確認しました。\n表示された項目名とサンプル値を次の設計に使います。'}catch(e){$('status').textContent='診断エラー：'+(e.message||e)}finally{if(db)db.close();$('run').disabled=false}}
})();
</script></body></html>
