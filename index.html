<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMA-NAVI AI</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101f33;--line:#29405b;--gold:#e5bd62;--muted:#a9b8ca}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}
main{max-width:850px;margin:auto}.brand{color:var(--gold);font-size:13px;letter-spacing:.18em;font-weight:700}
h1{font-size:27px;margin:7px 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
h2{font-size:17px;margin:0 0 12px;color:var(--gold)}
label{display:block;font-size:13px;margin:13px 0 6px;color:#dce5f0}
input[type=file],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#091728;color:#fff}
button{width:100%;border:0;border-radius:10px;background:var(--gold);color:#17202b;font-weight:800;padding:14px;font-size:16px;margin-top:16px}
.note{font-size:12px;line-height:1.6;color:var(--muted)}.status{white-space:pre-wrap;font-size:13px;line-height:1.65;margin-top:12px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat div{background:#091728;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}.num{font-size:22px;color:var(--gold);font-weight:800}.small{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--gold)}
.scroll{overflow-x:auto}select{margin:6px 0}
</style>
</head>
<body><main>
<div class="brand">UMA-NAVI AI</div>
<h1>地方競馬データ取込</h1>
<div class="sub">公式データファイルを端末内で読み込みます</div>
<section class="panel">
<h2>① データファイルを選択</h2>
<label>ホースリスト（horselist）</label><input id="horseFile" type="file">
<label>レースリスト（racelist）</label><input id="raceFile" type="file">
<label>払戻リスト（payback）</label><input id="payFile" type="file">
<p class="note">ZIPではなく、解凍後の3ファイルを選んでください。ファイルはサーバーへ送信せず、このブラウザ内で処理します。</p>
<button id="loadBtn">3ファイルを読み込む</button>
<div id="status" class="status">ファイルを3つ選択してください。</div>
</section>
<section class="panel" id="result" hidden>
<h2>② 読み込み結果</h2>
<div class="stat"><div><div class="num" id="raceCount">0</div><div class="small">レース数</div></div><div><div class="num" id="horseCount">0</div><div class="small">馬データ数</div></div><div><div class="num" id="payCount">0</div><div class="small">払戻データ数</div></div></div>
<label>レースを選択</label><select id="raceSelect"></select>
<div class="scroll"><table><thead><tr><th>馬番</th><th>馬名</th><th>性齢</th><th>騎手</th><th>斤量</th><th>人気</th></tr></thead><tbody id="horseRows"></tbody></table></div>
<p class="note">注意：公式ホースリストに着順・タイム等の結果項目が含まれる場合があります。発走前予想の学習・評価では、結果情報を予想入力に混ぜないようにしてください。</p>
</section>
<script>
const $=id=>document.getElementById(id);
let races=[],horses=[],pays=[];
function decodeBuffer(buf){
  const bytes=new Uint8Array(buf);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes).replace(/^\uFEFF/,'');}
  catch(e){try{return new TextDecoder('shift-jis').decode(bytes).replace(/^\uFEFF/,'');}
  catch(e2){return new TextDecoder().decode(bytes).replace(/^\uFEFF/,'');}}
}
async function readText(file){return decodeBuffer(await file.arrayBuffer());}
function splitLine(line,delimiter){return line.split(delimiter).map(x=>x.trim().replace(/^"|"$/g,''));}
function parseFile(text,kind){
  const lines=text.replace(/\r\n?/g,'\n').split('\n').filter(x=>x.trim()!=='');
  if(!lines.length)throw new Error(kind+' が空です');
  let found=null;
  for(let i=0;i<Math.min(lines.length,30);i++){
    const line=lines[i].replace(/^\uFEFF/,'');
    const delim=line.includes('\t')?'\t':(line.includes(',')?',':null);
    if(!delim)continue;
    const cols=splitLine(line,delim).map(x=>x.replace(/^\uFEFF/,'').trim());
    const joined=cols.join('|');
    const ok=kind==='horselist'
      ? joined.includes('競馬場')&&joined.includes('競走年月日')&&joined.includes('馬名')&&joined.includes('馬番')
      : kind==='racelist'
      ? joined.includes('競馬場')&&joined.includes('競走年月日')&&joined.includes('レース番号')&&joined.includes('距離')
      : joined.includes('競馬場')&&joined.includes('競走年月日');
    if(ok){found={index:i,delimiter:delim,headers:cols};break;}
  }
  if(!found)throw new Error(kind+'：見出し行を検出できません。文字コード・区切り形式を確認してください。');
  const rows=[];
  for(let i=found.index+1;i<lines.length;i++){
    const cells=splitLine(lines[i],found.delimiter);
    if(cells.length<2)continue;
    const obj={};found.headers.forEach((h,j)=>obj[h]=cells[j]??'');
    rows.push(obj);
  }
  return {headers:found.headers,rows};
}
function key(o){return [o['競馬場'],o['競走年月日'],o['レース番号']].join('|');}
function val(o,...names){for(const n of names)if(o[n]!==undefined&&o[n]!=='')return o[n];return '';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('loadBtn').addEventListener('click',async()=>{
  const hf=$('horseFile').files[0],rf=$('raceFile').files[0],pf=$('payFile').files[0];
  if(!hf||!rf||!pf){$('status').textContent='3つすべてのファイルを選択してください。';return;}
  $('status').textContent='読み込み中…';
  try{
    const [ht,rt,pt]=await Promise.all([readText(hf),readText(rf),readText(pf)]);
    const hp=parseFile(ht,'horselist'),rp=parseFile(rt,'racelist'),pp=parseFile(pt,'payback');
    horses=hp.rows;races=rp.rows;pays=pp.rows;
    const select=$('raceSelect');select.innerHTML='';
    races.forEach((r,i)=>{const op=document.createElement('option');op.value=String(i);op.textContent=[r['競馬場'],r['競走年月日'],r['レース番号']+'R',r['レース名']].filter(Boolean).join(' / ');select.appendChild(op);});
    $('raceCount').textContent=races.length.toLocaleString();
    $('horseCount').textContent=horses.length.toLocaleString();
    $('payCount').textContent=pays.length.toLocaleString();
    $('result').hidden=false;
    renderHorses();
    $('status').textContent='読み込み成功！3ファイルを認識しました。';
  }catch(e){$('status').textContent='読み込みエラー：'+e.message+'\n\n選択したファイル名が horselist / racelist / payback か確認してください。';}
});
function renderHorses(){
  const r=races[Number($('raceSelect').value)||0];if(!r)return;
  const k=key(r);
  const list=horses.filter(h=>key(h)===k);
  $('horseRows').innerHTML=list.map(h=>`<tr><td>${esc(h['馬番'])}</td><td>${esc(h['馬名'])}</td><td>${esc((h['性']||'')+(h['齢']||''))}</td><td>${esc(h['騎手名'])}</td><td>${esc(h['負担重量'])}</td><td>${esc(h['人気'])}</td></tr>`).join('')||'<tr><td colspan="6">このレースに一致する馬データがありません。</td></tr>';
}
$('raceSelect').addEventListener('change',renderHorses);
</script>
</main></body></html>
