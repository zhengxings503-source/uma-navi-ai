<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>UMA-NAVI AI バックアップ診断</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141f31;--line:#29384e;--gold:#e8bd58;--muted:#9eacc0;--txt:#f4f6fa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101b2c,#080e18);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}main{max-width:760px;margin:auto}h1{font-size:24px;color:var(--gold)}p{color:var(--muted);line-height:1.6}.panel{background:#141f31;border:1px solid var(--line);border-radius:15px;padding:15px;margin:14px 0}input,button{width:100%;padding:13px;border-radius:9px;margin-top:10px}input{background:#0b1422;color:white;border:1px solid var(--line)}button{border:0;background:var(--gold);font-weight:bold;font-size:15px}.status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:14px}.small{font-size:12px;color:var(--muted)}</style></head>
<body><main><h1>UMA-NAVI AI バックアップ診断</h1><p>このページはJSONの中身を調べるだけです。保存領域への書き込み・変更・削除は一切しません。</p>
<section class="panel"><b>① 23MBのバックアップJSONを選択</b><input id="f" type="file" accept=".json,application/json"><button id="check">バックアップを診断する</button></section>
<section class="panel"><b>② 診断結果</b><div id="out" class="status">まだ診断していません。</div></section>
<p class="small">診断結果には件数と先頭データのキー情報のみを表示します。馬名などの内容は送信されません。</p></main>
<script>
const $=id=>document.getElementById(id);
$('check').onclick=async()=>{const f=$('f').files[0];if(!f){$('out').textContent='先にJSONファイルを選択してください。';return;}const b=$('check');b.disabled=true;$('out').textContent='読み込み中…';try{const parsed=JSON.parse(await f.text());const root=parsed&&parsed.data&&typeof parsed.data==='object'?parsed.data:parsed;const names=['races','horses','pays'];let lines=[];lines.push('ファイル名：'+f.name,'ファイルサイズ：約'+(f.size/1024/1024).toFixed(2)+'MB','バックアップ形式：'+(parsed&&parsed.data?'data配下に保存':'最上位に保存'));for(const n of names){const a=Array.isArray(root[n])?root[n]:[];let valid=0,missing=0,keys=new Set(),duplicates=0;for(const x of a){if(x&&typeof x==='object'&&x._key){valid++;if(keys.has(String(x._key)))duplicates++;keys.add(String(x._key));}else missing++;}lines.push('');lines.push(n+ '：配列 '+a.length.toLocaleString()+'件');lines.push('_keyあり：'+valid.toLocaleString()+'件');lines.push('_keyなし：'+missing.toLocaleString()+'件');lines.push('ユニークキー：'+keys.size.toLocaleString()+'件');lines.push('重複キー：'+duplicates.toLocaleString()+'件');if(a.length){const x=a[0];lines.push('先頭データのキー：'+(x&&x._key?String(x._key):'なし'));lines.push('先頭データの項目名：'+(x&&typeof x==='object'?Object.keys(x).slice(0,12).join('、'):'オブジェクトではありません'));}}$('out').textContent=lines.join('\n');}catch(e){$('out').textContent='診断エラー：'+e.message;}finally{b.disabled=false;}};
</script></body></html>
