<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMA-NAVI AI 人気データ診断</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;margin:0;background:#f4f6f8;color:#18212b;padding:14px}h1{font-size:21px}h2{font-size:17px;margin:0 0 10px}.panel{background:white;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #0001}.small{font-size:13px;color:#52606d;white-space:pre-wrap}.status{white-space:pre-wrap;font-size:14px;padding:10px;background:#eef2f5;border-radius:8px}button{border:0;border-radius:9px;background:#1459a6;color:white;padding:12px 18px;font-size:16px;font-weight:600}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid #e5e9ed;text-align:left;white-space:nowrap}th{background:#f5f7f9}.tablewrap{overflow:auto}code{word-break:break-all}
</style></head><body><h1>UMA-NAVI AI 人気データ診断</h1><p class="small">umaNaviDB_v25を読み取り専用で調査します。データの追加・変更・削除は一切行いません。</p><section class="panel"><button id="go">診断を開始</button><p id="status" class="status">ボタンを押してください。</p></section>
<section class="panel"><h2>① 人気列の存在・値の分布</h2><div class="tablewrap"><table><thead><tr><th>列名</th><th>値の例</th><th>件数</th></tr></thead><tbody id="cols"></tbody></table></div></section>
<section class="panel"><h2>② 人気=1 の着順集計</h2><div id="sum" class="small">診断前</div><div class="tablewrap"><table><thead><tr><th>人気値</th><th>件数</th><th>1着</th><th>2着</th><th>3着</th><th>4着以下</th><th>着順不明</th></tr></thead><tbody id="dist"></tbody></table></div></section>
<section class="panel"><h2>③ 実際に1着だった馬の人気値</h2><div class="tablewrap"><table><thead><tr><th>人気値</th><th>1着馬の頭数</th></tr></thead><tbody id="wins"></tbody></table></div></section>
<section class="panel"><h2>④ 人気=1 のサンプル（最大30頭）</h2><div class="tablewrap"><table><thead><tr><th>日付</th><th>競馬場</th><th>R</th><th>馬番</th><th>馬名</th><th>人気の生値</th><th>着順</th></tr></thead><tbody id="samples"></tbody></table></div></section>
<section class="panel"><h2>⑤ 列名候補</h2><div id="headers" class="small"></div></section>
<script>'use strict';const DB='umaNaviDB_v25',V=1,$=id=>document.getElementById(id);function csv(s){const a=[];let v='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){a.push(v);v=''}else v+=c}a.push(v);return a}function decode(o){if(!o||typeof o!=='object')return null;const k=Object.keys(o).find(k=>k!=='_key'&&k.includes(','));if(!k)return null;const h=csv(k),v=csv(String(o[k]??''));if(h.length<8||v.length<h.length/2)return null;const x={};h.forEach((n,i)=>x[String(n).trim()]=v[i]??'');return x}const clean=v=>String(v??'').trim(),norm=v=>clean(v).normalize('NFKC').replace(/\s/g,'');function n(v){const m=norm(v).replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null}function get(x,k){return x[k]??''}function finish(x){const s=norm(get(x,'着順'));if(!s||/中止|取消|除外|失格|不成立|降着/.test(s))return null;const z=n(s);return z!==null&&z>0?z:null}function fmt(d){const s=String(d);return s.length===8?s.slice(0,4)+'/'+s.slice(4,6)+'/'+s.slice(6,8):s}function cell(v){const td=document.createElement('td');td.textContent=v;return td}function row(id,vals){const tr=document.createElement('tr');vals.forEach(v=>tr.appendChild(cell(v)));$(id).appendChild(tr)}async function run(){ $('go').disabled=true;$('status').textContent='データを読み込み中…';try{const db=await new Promise((ok,no)=>{const q=indexedDB.open(DB,V);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});let rows=[];await new Promise((ok,no)=>{const tx=db.transaction('horses','readonly'),req=tx.objectStore('horses').openCursor();req.onsuccess=()=>{const c=req.result;if(!c)return;const x=decode(c.value);if(x)rows.push(x);c.continue()};tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close();if(!rows.length)throw Error('馬データが読み込めませんでした');const keys=new Set();rows.slice(0,100).forEach(x=>Object.keys(x).forEach(k=>keys.add(k)));const headers=[...keys];$('headers').textContent='検出した列名：\n'+headers.join(' / ');const candidates=headers.filter(k=>/人気|順位|単勝|オッズ/.test(k));$('cols').innerHTML='';candidates.forEach(k=>{const counts=new Map();rows.forEach(x=>{const v=clean(x[k])||'(空欄)';counts.set(v,(counts.get(v)||0)+1)});const ex=[...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8).map(a=>a[0]+'('+a[1]+')').join(' / ');row('cols',[k,ex,rows.filter(x=>clean(x[k])!=='').length.toLocaleString()])});if(!candidates.length)row('cols',['人気等の列が見つからない','',0]);const stats=new Map(),winStats=new Map(),samples=[];let raceSet=new Set(),pop1Races=new Set(),pop1Wins=0,pop1Places=0,pop1Known=0,pop1Count=0,winCount=0;for(const x of rows){const p=clean(get(x,'人気')),f=finish(x),id=[norm(get(x,'競馬場')),norm(get(x,'競走年月日')),norm(get(x,'レース番号'))].join('|');if(id!=='||')raceSet.add(id);const key=p||'(空欄)';if(!stats.has(key))stats.set(key,{n:0,w:0,s:0,t:0,l:0,u:0});const z=stats.get(key);z.n++;if(f===null)z.u++;else if(f===1){z.w++;if(p)winStats.set(key,(winStats.get(key)||0)+1)}else if(f===2)z.s++;else if(f===3)z.t++;else z.l++;if(f===1)winCount++;if(p==='1'){pop1Count++;pop1Races.add(id);if(f!==null){pop1Known++;if(f===1)pop1Wins++;if(f<=3)pop1Places++}if(samples.length<30)samples.push({d:get(x,'競走年月日'),v:get(x,'競馬場'),r:get(x,'レース番号'),no:get(x,'馬番'),nm:get(x,'馬名'),p,f})}}
$('dist').innerHTML='';[...stats.entries()].sort((a,b)=>{const aa=n(a[0]),bb=n(b[0]);return (aa??9999)-(bb??9999)}).slice(0,40).forEach(([k,z])=>row('dist',[k,z.n.toLocaleString(),z.w.toLocaleString(),z.s.toLocaleString(),z.t.toLocaleString(),z.l.toLocaleString(),z.u.toLocaleString()]));$('wins').innerHTML='';[...winStats.entries()].sort((a,b)=>{const aa=n(a[0]),bb=n(b[0]);return (aa??9999)-(bb??9999)}).forEach(([k,v])=>row('wins',[k,v.toLocaleString()]));$('samples').innerHTML='';samples.forEach(x=>row('samples',[fmt(x.d),x.v,x.r,x.no,x.nm,x.p,x.f??'不明']));$('sum').textContent=`馬データ総数：${rows.length.toLocaleString()}\nレースID数：${raceSet.size.toLocaleString()}\n人気=1の馬データ：${pop1Count.toLocaleString()}頭／該当レース数：${pop1Races.size.toLocaleString()}\n人気=1の着順判明：${pop1Known.toLocaleString()}頭／1着：${pop1Wins.toLocaleString()}頭／3着以内：${pop1Places.toLocaleString()}頭\n全体の1着馬データ：${winCount.toLocaleString()}頭\n※人気列は「人気」という完全一致の列名を調査。下の列名候補も確認してください。`;$('status').textContent=`診断完了。馬データ ${rows.length.toLocaleString()}件を読み取りました。\nこのページは読み取り専用です。表示された①〜⑤の内容をコピーして送ってください。`;}catch(e){$('status').textContent='診断エラー：'+e.message;$('go').disabled=false}}$('go').addEventListener('click',run);
</script></body></html>
