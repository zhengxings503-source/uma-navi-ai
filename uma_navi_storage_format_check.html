<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMA-NAVI AI 保存形式確認</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f6f8;color:#17202a;margin:0;padding:18px}
main{max-width:760px;margin:auto}h1{font-size:22px}p{line-height:1.6}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#1769aa;color:white;font-size:17px;font-weight:700}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #ddd;border-radius:10px;padding:14px;font-size:12px;line-height:1.5}
.note{background:#fff8df;padding:12px;border-radius:9px}
</style></head><body><main>
<h1>保存形式の確認</h1>
<p>IndexedDBに保存されているレコードを、そのまま数件だけ表示します。</p>
<div class="note">読み取り専用です。追加・変更・削除・初期化はしません。データ全件は読み込まず、各ストアの先頭3件だけ確認します。</div>
<p><button id="run">保存形式を確認する</button></p>
<div id="status">待機中</div><pre id="out">結果はここに表示されます。</pre>
<script>
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{
 const r=indexedDB.open("umaNaviDB_v25",1);
 r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 r.onupgradeneeded=()=>{r.transaction.abort();reject(new Error("DB version mismatch"))};
})}
function inspect(db,name){return new Promise((resolve,reject)=>{
 const tx=db.transaction(name,"readonly"),s=tx.objectStore(name),out={store:name,keyPath:s.keyPath,autoIncrement:s.autoIncrement,samples:[]};
 const r=s.openCursor();r.onsuccess=()=>{
  const c=r.result;if(!c){resolve(out);return}
  const v=c.value;
  let sample={cursorKey:c.key,valueType:typeof v,isArray:Array.isArray(v)};
  if(v&&typeof v==="object"){
   sample.keys=Object.keys(v);
   sample.entries=Object.entries(v).slice(0,18).map(([k,x])=>({key:k,type:typeof x,isArray:Array.isArray(x),value:typeof x==="string"?x.slice(0,500):x}));
   sample.json=JSON.stringify(v).slice(0,2500);
  } else sample.value=v;
  out.samples.push(sample);
  if(out.samples.length<3)c.continue();else resolve(out);
 };
 r.onerror=()=>reject(r.error);
})}
$("run").onclick=async()=>{
 $("run").disabled=true;$("status").textContent="確認中…";
 let db;
 try{
  db=await openDB();
  const results=[];
  for(const name of ["races","horses","pays"])results.push(await inspect(db,name));
  $("out").textContent=JSON.stringify(results,null,2);
  $("status").textContent="確認完了。表示内容をすべてコピーして送ってください。";
 }catch(e){$("status").textContent="エラー";$("out").textContent=String(e&&e.message||e)}
 finally{if(db)db.close();$("run").disabled=false}
};
</script></main></body></html>
