<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMA-NAVI AI 人気データ診断 v2</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;margin:0;background:#f4f6f8;color:#18212b;padding:14px}h1{font-size:21px}h2{font-size:17px;margin:0 0 10px}.panel{background:white;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #0001}.small{font-size:13px;color:#52606d;white-space:pre-wrap}.status{white-space:pre-wrap;font-size:14px;padding:10px;background:#eef2f5;border-radius:8px}button{border:0;border-radius:9px;background:#1459a6;color:white;padding:12px 18px;font-size:16px;font-weight:600}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid #e5e9ed;text-align:left;white-space:nowrap}th{background:#f5f7f9}.tablewrap{overflow:auto}progress{width:100%;height:16px}
</style></head><body><h1>UMA-NAVI AI 人気データ診断 v2</h1><p class="small">読み取り専用。馬データを1,000件ずつ別々に読み込み、集計だけを保持します。データの追加・変更・削除は行いません。</p><section class="panel"><button id="go">診断を開始</button><p id="status" class="status">ボタンを押してください。</p><progress id="prog" max="283709" value="0"></progress></section>
<section class="panel"><h2>① 人気列の存在・値の分布</h2><div class="tablewrap"><table><thead><tr><th>列名</th><th>値の例・分布</th><th>値あり件数</th></tr></thead><tbody id="cols"></tbody></table></div></section>
<section class="panel"><h2>② 人気別の着順集計</h2><div id="sum" class="small">診断前</div><div class="tablewrap"><table><thead><tr><th>人気値</th><th>件数</th><th>1着</th><th>2着</th><th>3着</th><th>4着以下</th><th>着順不明</th></tr></thead><tbody id="dist"></tbody></table></div></section>
<section class="panel"><h2>③ 実際に1着だった馬の人気値</h2><div class="tablewrap"><table><thead><tr><th>人気値</th><th>1着馬の頭数</th></tr></thead><tbody id="wins"></tbody></table></div></section>
<section class="panel"><h2>④ 人気=1 のサンプル（最大30頭）</h2><div class="tablewrap"><table><thead><tr><th>日付</th><th>競馬場</th><th>R</th><th>馬番</th><th>馬名</th><th>人気の生値</th><th>着順</th></tr></thead><tbody id="samples"></tbody></table></div></section>
<section class="panel"><h2>⑤ 列名候補</h2><div id="headers" class="small"></div></section>
<script>'use strict';
const DB='umaNaviDB_v25',V=1,BATCH=1000,$=id=>document.getElementById(id);
function csv(s){const a=[];let v='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){a.push(v);v=''}else v+=c}a.push(v);return a}
function decode(o){if(!o||typeof o!=='object')return null;const k=Object.keys(o).find(k=>k!=='_key'&&k.includes(','));if(!k)return null;const h=csv(k),v=csv(String(o[k]??''));if(h.length<8||v.length<h.length/2)return null;const x={};for(let i=0;i<h.length;i++)x[String(h[i]).trim()]=v[i]??'';return x}
const clean=v=>String(v??'').trim(),norm=v=>clean(v).normalize('NFKC').replace(/\s/g,'');
function num(v){const m=norm(v).replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null}
function finish(x){const s=norm(x['着順']);if(!s||/中止|取消|除外|失格|不成立|降着/.test(s))return null;const z=num(s);return z!==null&&z>0?z:null}
function fmt(d){const s=String(d);return s.length===8?s.slice(0,4)+'/'+s.slice(4,6)+'/'+s.slice(6,8):s}
function cell(v){const td=document.createElement('td');td.textContent=v;return td}function row(id,vals){const tr=document.createElement('tr');vals.forEach(v=>tr.appendChild(cell(v)));$(id).appendChild(tr)}
function openDB(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,V);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error||new Error('DBを開けません'))})}
function readBatch(db,lower,limit){return new Promise((resolve,reject)=>{let tx,items=[],last=null,done=false;try{tx=db.transaction('horses','readonly');const store=tx.objectStore('horses');let range;try{range=lower===undefined?undefined:IDBKeyRange.lowerBound(lower,true)}catch(e){reject(e);return}const req=store.openCursor(range);req.onsuccess=()=>{const c=req.result;if(!c){done=true;return}items.push(c.value);last=c.primaryKey;if(items.length<limit)c.continue();else done=false};req.onerror=()=>reject(req.error||new Error('カーソル読み込みエラー'));tx.oncomplete=()=>resolve({items,last,done});tx.onerror=()=>reject(tx.error||new Error('トランザクションエラー'));tx.onabort=()=>reject(tx.error||new Error('読み込みが中断されました'))}catch(e){reject(e)}})}
async function run(){const btn=$('go');btn.disabled=true;$('status').textContent='データベースを開いています…';$('prog').value=0;for(const id of ['cols','dist','wins','samples'])$(id).innerHTML='';$('sum').textContent='集計中';$('headers').textContent='';let db;
try{db=await openDB();const storeCount=await new Promise((ok,no)=>{const tx=db.transaction('horses','readonly'),r=tx.objectStore('horses').count();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});if(!storeCount)throw new Error('馬データが0件です');$('prog').max=storeCount;
const columns=new Map(),stats=new Map(),winStats=new Map(),samples=[];let total=0,knownWins=0,raceSet=new Set(),pop1Races=new Set(),pop1Count=0,pop1Known=0,pop1Wins=0,pop1Places=0,lower,finished=false;
while(!finished){const batch=await readBatch(db,lower,BATCH);if(!batch.items.length)break;for(const raw of batch.items){const x=decode(raw);total++;if(x){for(const k of Object.keys(x)){if(!columns.has(k))columns.set(k,{n:0,values:new Map()});const c=columns.get(k),v=clean(x[k]);if(v){c.n++;c.values.set(v,(c.values.get(v)||0)+1)}}const p=clean(x['人気']),f=finish(x),id=[norm(x['競馬場']),norm(x['競走年月日']),norm(x['レース番号'])].join('|'),key=p||'(空欄)';if(id!=='||')raceSet.add(id);if(!stats.has(key))stats.set(key,{n:0,w:0,s:0,t:0,l:0,u:0});const z=stats.get(key);z.n++;if(f===null)z.u++;else if(f===1){z.w++;knownWins++;winStats.set(key,(winStats.get(key)||0)+1)}else if(f===2)z.s++;else if(f===3)z.t++;else z.l++;if(p==='1'){pop1Count++;pop1Races.add(id);if(f!==null){pop1Known++;if(f===1)pop1Wins++;if(f<=3)pop1Places++}if(samples.length<30)samples.push({d:x['競走年月日'],v:x['競馬場'],r:x['レース番号'],no:x['馬番'],nm:x['馬名'],p,f})}}}
$('prog').value=total;$('status').textContent=`読み込み中：${total.toLocaleString()} / ${storeCount.toLocaleString()} 件\n1,000件単位で処理しています。Safariを閉じずに待ってな。`;
lower=batch.last;finished=batch.done||!batch.last;await new Promise(r=>setTimeout(r,0));}
const candidates=[...columns.keys()].filter(k=>/人気|順位|単勝|オッズ/.test(k));$('headers').textContent='検出した列名：\n'+[...columns.keys()].join(' / ');for(const k of candidates){const c=columns.get(k),ex=[...c.values.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10).map(([v,n])=>v+'('+n+')').join(' / ');row('cols',[k,ex,c.n.toLocaleString()])}if(!candidates.length)row('cols',['人気等の列が見つからない','',0]);
[...stats.entries()].sort((a,b)=>(num(a[0])??9999)-(num(b[0])??9999)).slice(0,50).forEach(([k,z])=>row('dist',[k,z.n.toLocaleString(),z.w.toLocaleString(),z.s.toLocaleString(),z.t.toLocaleString(),z.l.toLocaleString(),z.u.toLocaleString()]));[...winStats.entries()].sort((a,b)=>(num(a[0])??9999)-(num(b[0])??9999)).forEach(([k,v])=>row('wins',[k,v.toLocaleString()]));samples.forEach(x=>row('samples',[fmt(x.d),x.v,x.r,x.no,x.nm,x.p,x.f??'不明']));$('sum').textContent=`馬データ総数：${total.toLocaleString()}件（DB件数 ${storeCount.toLocaleString()}件）\nCSV解析成功後のレースID数：${raceSet.size.toLocaleString()}\n人気=1の馬データ：${pop1Count.toLocaleString()}頭／該当レース数：${pop1Races.size.toLocaleString()}\n人気=1の着順判明：${pop1Known.toLocaleString()}頭／1着：${pop1Wins.toLocaleString()}頭／3着以内：${pop1Places.toLocaleString()}頭\n全体の1着馬データ：${knownWins.toLocaleString()}頭\n※人気列は「人気」という完全一致の列名で集計。①と⑤の列名も確認してください。`;$('status').textContent=`診断完了。${total.toLocaleString()}件を読み取りました。\n①〜⑤の結果をコピーして送ってください。`;db.close();db=null;
}catch(e){$('status').textContent='診断エラー：'+(e&&e.message?e.message:String(e))+'\nページを閉じずに、この表示を教えてください。';btn.disabled=false;if(db)try{db.close()}catch(_){}}
}
$('go').addEventListener('click',run);
</script></body></html>
